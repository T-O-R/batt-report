<!DOCTYPE html>
<html>
<head>
    <title>Battery Analytics Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #020617;
            font-size: 22px;
            font-weight: bold;
        }

        .upload {
            text-align: center;
            padding: 20px;
        }

        input {
            margin-top: 10px;
        }

        .summary {
            margin: 20px;
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
            gap: 15px;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
        }

        .card h3 {
            font-size: 14px;
            color: #94a3b8;
            margin: 0;
        }

        .card p {
            font-size: 22px;
            margin: 10px 0 0;
            font-weight: bold;
        }

        canvas {
            margin: 20px;
            background: #1e293b;
            border-radius: 12px;
            padding: 10px;
        }
    </style>
</head>

<body>

<header>
🔋 Battery Analytics Dashboard
</header>

<div class="upload">
    Upload multiple battery reports:<br>
    <input type="file" id="files" multiple accept=".html">
</div>

<div class="summary" id="summary">
    Summary will appear here...
</div>

<div class="grid">
    <div class="card"><h3>Latest Health</h3><p id="latestHealth">-</p></div>
    <div class="card"><h3>Cycle Count</h3><p id="cycle">-</p></div>
    <div class="card"><h3>Full Capacity</h3><p id="full">-</p></div>
    <div class="card"><h3>Design Capacity</h3><p id="design">-</p></div>
</div>

<canvas id="chart" height="100"></canvas>

<script>
const results = [];

document.getElementById('files').addEventListener('change', function(e) {
    const files = e.target.files;

    results.length = 0;

    let loaded = 0;

    for (let file of files) {
        const reader = new FileReader();

        reader.onload = function(event) {
            const html = event.target.result;
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');

            const getValue = (label) => {
                const cells = [...doc.querySelectorAll('td')];
                for (let i = 0; i < cells.length; i++) {
                    if (cells[i].innerText.includes(label)) {
                        return cells[i + 1]?.innerText.trim();
                    }
                }
                return null;
            };

            const full = getValue('FULL CHARGE CAPACITY');
            const design = getValue('DESIGN CAPACITY');
            const cycle = getValue('CYCLE COUNT');
            const date = getValue('REPORT TIME');

            if (full && design) {
                const fullVal = parseInt(full.replace(/[^0-9]/g, ''));
                const designVal = parseInt(design.replace(/[^0-9]/g, ''));

                const health = Math.round((fullVal / designVal) * 100);

                results.push({
                    date: date || 'Unknown',
                    health,
                    cycle,
                    full,
                    design
                });
            }

            loaded++;

            if (loaded === files.length) {
                render();
            }
        };

        reader.readAsText(file);
    }
});

function render() {
    results.sort((a, b) => new Date(a.date) - new Date(b.date));

    const latest = results[results.length - 1];

    document.getElementById('latestHealth').innerText = latest.health + '%';
    document.getElementById('cycle').innerText = latest.cycle;
    document.getElementById('full').innerText = latest.full;
    document.getElementById('design').innerText = latest.design;

    // SUMMARY LOGIC
    let summaryText = "";

    if (latest.health >= 95) {
        summaryText = "✅ Battery is in EXCELLENT condition. Very minimal wear. Performance is strong.";
    } else if (latest.health >= 85) {
        summaryText = "⚠️ Battery is in GOOD condition. Some wear but still reliable.";
    } else {
        summaryText = "❌ Battery is WEAK. Noticeable degradation. Consider replacement soon.";
    }

    document.getElementById('summary').innerText = summaryText;

    // CHART
    const ctx = document.getElementById('chart').getContext('2d');

    if (window.chart) {
        window.chart.destroy();
    }

    window.chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: results.map(r => r.date),
            datasets: [{
                label: 'Battery Health %',
                data: results.map(r => r.health),
                fill: false
            }]
        },
        options: {
            responsive: true
        }
    });
}
</script>

</body>
</html>
