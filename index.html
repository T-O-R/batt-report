<!DOCTYPE html>
<html>
<head>
    <title>Battery Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #020617;
            font-size: 22px;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card h3 {
            margin: 0;
            font-size: 14px;
            color: #94a3b8;
        }

        .card p {
            font-size: 22px;
            margin: 10px 0 0;
            font-weight: bold;
        }

        .good { color: #22c55e; }
        .warn { color: #f59e0b; }
        .bad { color: #ef4444; }

        .iframe-container {
            padding: 20px;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 12px;
            background: #111;
        }
    </style>
</head>

<body>

<header>
    🔋 Battery Health Dashboard
</header>

<div class="grid">

    <div class="card">
        <h3>Battery Health</h3>
        <p class="good">108%</p>
    </div>

    <div class="card">
        <h3>Full Charge Capacity</h3>
        <p>86,750 mWh</p>
    </div>

    <div class="card">
        <h3>Design Capacity</h3>
        <p>80,000 mWh</p>
    </div>

    <div class="card">
        <h3>Cycle Count</h3>
        <p>4 Cycles</p>
    </div>

    <div class="card">
        <h3>Estimated Battery Life</h3>
        <p>~1 hr 10 min</p>
    </div>

</div>

<div class="iframe-container">
    <iframe src="battery-report.html"></iframe>
</div>

</body>
</html>
